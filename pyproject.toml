[project]
name = "yastubo-backend"
version = "0.1.0"
description = "Yastubo backend for migrant funeral plans"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "loguru>=0.7.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "cryptography>=44.0.0",
    "pydantic[email]>=2.9.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "weasyprint>=62.0",
    "jinja2>=3.1.0",
    "stripe>=11.0.0",
    "arq>=0.26",
    "rich>=13.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pre-commit>=3.8.0",
    "aiosqlite>=0.20.0",
    "fakeredis[aioredis]>=2.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
